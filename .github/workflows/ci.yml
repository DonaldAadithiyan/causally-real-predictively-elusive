name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Lint (syntax + undefined names)
        run: |
          python -m pip install ruff==0.6.9
          ruff check --select E9,F63,F7,F82 src experiments paper scripts tests
      - name: Data (ETTh1/ETTh2, hash-checked)
        run: python scripts/download_data.py
      - name: Tests (leakage, paper numbers, config constants, smoke)
        run: python -m pytest -q
