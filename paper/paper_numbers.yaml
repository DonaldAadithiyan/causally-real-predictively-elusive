  - {id: fisher_pooled, where: "§5.1", printed: "$p = 6\\times10^{-10}$", fn: fisher_selection_null, args: ["all 30"]}
  - {id: fisher_etth1, where: "§5.1", printed: "$p = 0.62$", fn: fisher_selection_null, args: [ETTh1]}

