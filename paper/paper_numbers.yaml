# Every number printed in the camera-ready paper, copied verbatim from the LaTeX source, and the
# function in paper/paper_numbers.py that recomputes it from results/. The test normalises both
# sides (drops $ \ { } and spaces; treats --, en dash and minus alike) and asserts equality.
# `known_mismatch` marks entries where the recomputed value differs from the printed one; the test
# expects the mismatch (strict xfail) so CI stays green while the discrepancy stays visible, and
# fails if it is fixed in one place but not the other.

abstract_intro:
  - {id: l2_share, where: "Abstract; §1 contribution 1; §5.1", printed: "17--47\\%", fn: l2_share_range}
  - {id: runs_total, where: "Abstract; §1; §6", printed: "36", fn: n_runs_r2_negative}
  - {id: runs_itransformer, where: "Abstract; §6", printed: "30", fn: n_itransformer_runs}
  - {id: oracle_bound, where: "Abstract; §1 contribution 3; §6", printed: "18--39\\%", fn: oracle_bound_range}

method_setup:
  - {id: layer_sweep_taps, where: "§3.1", printed: "seven", fn: layer_sweep_n_taps, expect_numeric: "7"}
  - {id: layer_sweep_corr, where: "§3.1", printed: "0.08--0.21", fn: layer_sweep_range,
     note: "PCA-based max |corr| per tap (max_abs_corr_pc). The raw max |corr| would be 0.09-0.22."}
  - {id: profile_rank, where: "§3.1 Difficulty score", printed: "0.95--0.997", fn: profile_rank_agreement}
  - {id: ks_shift, where: "§4 Data and splits", printed: "$p<0.05$", fn: ks_all_below_005,
     note: "From the v2_confirm (Kaggle-copy) runs; the test is on the raw target series."}
  - {id: etth_id_coverage, where: "§4 Caveats", printed: "0.86", fn: etth_id_max_coverage}
  - {id: traffic_id_coverage, where: "§4 Caveats", printed: "1.000", fn: traffic_id_coverage}

