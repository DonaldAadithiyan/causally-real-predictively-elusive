# V2 Phase 2 — cross-environment invariance (the measurement Run 5 skipped). PRE-REGISTERED.
# Depends on results/v2/v2_phase1/*/mvdf_v2_selection.json (the feature sets) and the SAE
# trained in Phase 1 at the winning tap.
#
# Environment carve-out (committed in configs/environment_splits/README.md BEFORE this runs):
#   E_select     — feature selection ONLY (Phase 1 used it; Phase 2 must NOT re-touch it)
#   E_eval_ID    — in-distribution invariance
#   E_eval_shift — shifted invariance
# Fractions (1/3, 1/3, 1/3) of the TEST split. The leakage assertion
# (validation/invariance.assert_no_leakage) fires if E_select appears among the eval tags.

run_name: v2_phase2
seed: 0
device: cpu

datasets: [ETTh1, ETTh2, ETTm1, ETTm2, traffic, electricity, weather, solar]

dataset_defaults:
  lookback: 96
  horizon: 96
  target_var: -1
  max_channels: 48

forecaster: {d_model: 256, n_layers: 3, n_heads: 8, d_ff: 512, dropout: 0.1,
             lr: 0.0001, batch_size: 32, max_epochs: 20, patience: 5, lr_decay: 0.8, warmup_epochs: 3}

sae: {expansion: 8, k: 64, steps: 20000, batch_size: 512, lr: 0.0001,
      resample_every: 2000, resample_until_frac: 0.5, resample_cap: 64}

phase2:
  n_bins: 5                       # conditional-difficulty-curve bins (spec §4.7)
  feature_budget_k: 12
  # invariance is computed for EVERY feature-set condition:
  conditions: [random, correlated, intervention_only, MVDF_v1, MVDF_v2]
  # E_eval_shift is further split into 2 sub-blocks so I() has >=2 shift environments
  n_shift_subenvs: 2

fallback_tap: pre_head
